[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-dome-decision-making"
description = "A library that defines a ucl-open data schema for the coen-dome-decision-making experiment."
authors = [ {name = "NeuroThom", email = "t.ryan@neurogears.org"}]
license = "MIT"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "swc-aeon>=0.2.0",
  "open-rigs",
  "pydantic-settings"
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "pyyaml>=6.0.3",
]

# [project.urls]
# Documentation = "https://ucl-open.github.io/Ucl.Open.CoenDomeDecisionMaking/"
# Repository = "https://github.com/UclOpen/Ucl.Open.CoenDomeDecisionMaking/"
# Issues = "https://github.com/UclOpen/Ucl.Open.CoenDomeDecisionMaking/issues"
# Changelog = "https://github.com/UclOpen/Ucl.Open.CoenDomeDecisionMaking/releases"
[project.scripts]
regenerate-schemas = "ucl_open_coen_dome_decision_making.regenerate:main"
suggest-stage = "ucl_open_coen_dome_decision_making.stage:main"
summarise-experiment = "open_rigs.rigs.trials:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "b59016c6a87bcdacbf8bff6509d010fecb80b09c"}
swc-aeon = { git = "https://github.com/SainsburyWellcomeCentre/aeon_api.git", branch = "main" }
