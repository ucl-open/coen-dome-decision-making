[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[project]
name = "ucl-open-coen-dome-decision-making"
description = "The coen-dome-decision-making experiment's task schema and shaping-stage choice."
authors = [ {name = "NeuroThom", email = "t.ryan@neurogears.org"}]
license = "BSD-3-Clause"
requires-python = ">=3.11, <3.12"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
version = "0.0.0-rc1"
readme = {file = "README.md", content-type = "text/markdown"}

dependencies = [
  "open-rigs",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
    "pyyaml>=6.0.3",
]

[project.scripts]
regenerate-schemas = "ucl_open_coen_dome_decision_making.regenerate:main"
summarise-experiment = "open_rigs.rigs.trials:main"

[tool.ruff]
line-length = 120
target-version = 'py311'

[tool.ruff.lint]
extend-select = ['Q', 'RUF100', 'C90', 'I']
extend-ignore = []
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.codespell]
skip = '.git,*.pdf,*.svg,./bonsai,*.bonsai,./docs/_build,uv.lock,*Generated.cs'
ignore-words-list = 'nd'

[tool.uv]
required-version = '>=0.8.4'

[tool.uv.sources]
# The lab's fork, at the same commit as coen-dome-navigation: both workflows read the same
# rig.yml, so their rig models must come from the same open-rigs. lib-open-rigs' update-workflows moves this pin.
open-rigs = {git = "https://github.com/Coen-Lab/lib-open-rigs", rev = "044244d3664c994dce84d587f7051acb33735cd1"}