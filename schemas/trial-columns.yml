# What each BonsaiData_Trial column this workflow writes means (TrialRow.cs builds the row, from TrialLogic.cs's Trial).
# ExperimentManifest (TrialColumns) copies this file into every experiment's manifest.json at
# Start, so each experiment carries the meaning of its own trial log; open_rigs.trials reads it
# from there (lib-open-rigs DECISIONS.md, stage 3).
#
# Each column: type (int, double, bool or string), and where they apply values (the strings it
# may hold, or a code: meaning map), unit, formerly (names it was recorded under before, newest
# first) and description. The names and types must also be on the lab's list
# (K:\config\data-dictionary.json, edited from rig-setup's Repos page): rig-control checks both
# before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a duration or other quantity
# ends in its unit (itiSeconds, rewardSizeUl); never store a latency. Seconds, the row's own
# Harp time, is the one exception.

Seconds:
  type: double
  unit: s
  description: Harp time the row was stamped, when the outcome is known (the choice, or the end of the response window).
trialNumber:
  type: int
  formerly: [TrialCnt]
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [visual, auditory, audiovisualCoherent, audiovisualConflict, neutral]
  description: What the trial showed, in words (TrialDraw.TypeNames, also the keys of the task's trialWeights and rulesPerType) - one modality alone, both on the same side (coherent) or opposite sides (conflict), or neutral (grey screen; a centre sound in localization, silent in discrimination). In discrimination the target modality's trials and the other modality's say which they showed; the task file's targetModality (in the manifest) says which is the target. Until 9 Nov 2026 it was a code, 0 Visual (discrimination - target), 1 Audio (distractor), 2 AVCoherent, 3 AVConflict, 4 Neutral; those experiments' manifests carry that meaning.
target:
  type: string
  values: [Left, Right]
  formerly: [targetSide]
  description: The side that was right.
choice:
  type: string
  values: [Left, Right, NoResponse]
  formerly: [response]
  description: The side the mouse chose.
outcome:
  type: string
  values: [Correct, Incorrect, NoResponse]
  description: The trial's result.
stimulusOnsetTime:
  type: double
  unit: s
  formerly: [stimulusOnsetSeconds]
  description: Harp time the workflow commanded the stimulus on, NaN if it never was - the trial's Go plus the lead, max(laserToStimulusSeconds, 0) in the task file (in the manifest); with optogenetics the trigger was stimulusOnsetTime - laserToStimulusSeconds. The physical onset is in the hardware logs.
choiceTime:
  type: double
  unit: s
  description: Harp time of the lick the workflow counted as the choice; NaN on NoResponse.
rewardSizeUl:
  type: double
  unit: ul
  formerly: [rewardSize]
  description: Microlitres a reward on this trial gives, the stage's rewardSizeUl times reward.largeRewardMultiplier on a large-reward trial (largeReward said which until 9 Nov 2026). What was delivered is RewardDelivered in BonsaiData_Async.
bothSpouts:
  type: bool
  formerly: [BothSpouts]
  description: True when both spouts were offered (otherwise only the correct one).
repeatCount:
  type: int
  description: How many times in a row the trial has been repeated, 0 for a new draw.
itiSeconds:
  type: double
  unit: s
  formerly: [itiDuration]
  description: The inter-trial interval drawn for this trial (uniformly, itiMinSeconds to itiMaxSeconds, a repeat too), from itiStartTime (the last outcome, after any timeout) to this trial's stimulus with a quiet mouse, drinkSeconds included; the stage's quiet waits add quietWaitSeconds, so the stimulus was commanded at itiStartTime + itiSeconds + quietWaitSeconds. From 13 Nov 2026 (Pip) it is what ran, and trial 1 has one too. Before, it was the draw before the trial (NaN on the first), ran to the trial's start (the Zapit arm), and a draw shorter than drinkSeconds ran as drinkSeconds plus 0.1 s to arm and laserToStimulusSeconds; until 9 Nov 2026 it was the interval after the trial.
itiStartTime:
  type: double
  unit: s
  description: Harp time the inter-trial interval before this trial began - the last trial's outcome, after any timeout; on trial 1 the first draw, once the experiment folder existed (NaN on trial 1 until 13 Nov 2026).
quietWaitSeconds:
  type: double
  unit: s
  description: How long the stage's quiet waits (lickQuietSeconds, wheelQuietSeconds and wheelQuietCm) held this trial's Go past the end of its interval less the lead; 0 with the waits off or a quiet mouse. From 13 Nov 2026.
punishSound:
  type: bool
  description: True when the error sound played - an incorrect choice, with the task's punishment.sound enabled.
punishTimeoutSeconds:
  type: double
  unit: s
  description: The timeout after this trial - the task's punishment.timeoutSeconds after an incorrect choice or a miss that was not auto-rewarded; 0 otherwise.
visualAzimuthDeg:
  type: double
  unit: deg
  formerly: [visualAzimuth]
  description: Grating azimuth.
visualElevationDeg:
  type: double
  unit: deg
  formerly: [visualElevation]
  description: Grating elevation.
visualContrast:
  type: double
  description: Grating contrast as BonVision's Contrast, 1 full contrast; the task files' habituation stages draw 3.0.
visualPhaseRad:
  type: double
  unit: rad
  formerly: [visualPhase]
  description: Grating phase.
audioAzimuthDeg:
  type: double
  unit: deg
  formerly: [audioAzimuth]
  description: Azimuth of the speaker that played, rig.yml's nearest to the location drawn; NaN when none played.
audioElevationDeg:
  type: double
  unit: deg
  formerly: [audioElevation]
  description: Elevation of the speaker that played; NaN when none played.
audioWaveformIndex:
  type: int
  description: Index into the auditory stimulus set (src\LocalFiles\AuditoryStimuli\filtered_pink_pulse_train_<index>.wav).
laserCondition:
  type: int
  formerly: [optoCondition]
  description: The Zapit condition sent to Zapit this trial, 0 without optogenetics (Zapit numbers conditions from 1). With optogenetics every trial sends one, the laser off at 0 mW on laser-off trials (the galvos move and the masking light shows), so laserPowerMw > 0 says the laser was on. From 13 Nov 2026; before, a condition was sent only with the laser on. Until 9 Nov 2026 optoStimulated also said whether there was stimulation.
laserPowerMw:
  type: double
  unit: mW
  description: Laser power sent to Zapit for this trial (the task's optogenetics.laserPowerMw), as commanded, not measured. 0 on laser-off trials, without optogenetics, and on a trial answered before its trigger (no laser after an answer, from 13 Nov 2026). From 10 Nov 2026; before, Zapit's config file set the power.
autoRewarded:
  type: bool
  description: True when a miss on an auto-reward trial was rewarded at the target spout.
