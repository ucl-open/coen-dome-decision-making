# What each WorkflowData_Trials column this workflow writes means. ExperimentManifest (TrialColumns) copies
# this file into every experiment's manifest.json at Start, so each experiment carries the meaning of its
# own trial log; open_rigs.trial_log reads it from there.
#
# Each column: type (int, double, bool or string), and where they apply values (the strings it may hold),
# unit, description (what it is), and note (this task's detail); copyOf, a task
# path (dotted) the column copies from the trial's Settings_Combinations row (else Settings_Task), and nanWhen {column,
# equals}, the rows where it is NaN instead, which open_rigs.trial_log checks on every load. The names and types must also be in the lab's
# Data Dictionary (K:\config\data-dictionary.json, edited on app-rig-control's Lab Names page): app-rig-control checks
# both before it launches the workflow.
#
# Naming: camelCase; a Harp time ends in Time and is in seconds; a duration or other quantity ends in its
# unit (itiSeconds, rewardOfferedUl); never a stored latency.
#
# The first 29 columns, harpTime to autoReward, are the lab's shared block, its core with the quietWait, trialEnd,
# optogenetics, conditions, stimulus and autoReward blocks,
# defined once in lib-open-rigs open_rigs.rigs.trials: coen-dome-decision-making and
# coen-dome-navigation list them in this order with these types, units and descriptions, word for word
# (tests/test_trial_columns.py holds both), so one analysis reads both tasks.
# trialType and outcome are described per task, and which trials are rewarded and penalised in those columns' notes. This task's own columns follow.

harpTime:
  type: double
  unit: s
  description: Harp time the row was complete, when the outcome was known (outcomeTime). The lab's time column, first in every log (lib-open-rigs specs/logging.md, section 4); a trial's moments are read from their own columns.
trialNumber:
  type: int
  description: The trial's number in the experiment, from 1.
trialType:
  type: string
  values: [visual, auditory, audiovisualCoherent, audiovisualConflict, neutral, go, noGo, left, right]
  description: The label of the trial's condition (trialConditionId) - a name for the rows and analysis groups that drives nothing; what the trial showed and rewarded are its own columns (visualInitialContrast, auditoryInitialLevelDbfs, the azimuths, target). It is derived at Go from the condition's settings (the task schema's x-trial-types), never stored - go, noGo, left or right for that target; else one modality alone, both on the same side (audiovisualCoherent) or mirrored (audiovisualConflict), or neutral (neither; a centre sound counts as none).
outcome:
  type: string
  values: [correct, incorrect, noResponse, probe, auto]
  description: The trial's result - correct when the choice was the target, incorrect when it was the other side, noResponse with no choice in the response window, auto with no choice on an auto-reward trial (the auto-reward answered it; autoReward, rewarded). In discriminationGoNoGo a lick (choice go) on a go trial is correct and none noResponse (auto on an auto-reward go trial), a lick on noGo incorrect and none correct. A probe trial (target noReward or random, a trial with no right answer) is probe whatever the choice, and left out of performance; rewarded and penalised say what it got.
itiStartTime:
  type: double
  unit: s
  description: 'Harp time the inter-trial interval before this trial began: the last trial''s trialEndTime (its outcomeTime in a log without trialEndTime) plus its penaltyTimeoutSeconds, exactly; on trial 1 the first Harp clock tick once the trials started.'
  note: Here the response window always runs in full, so trialEndTime is the response window's end; a lick never brings the interval forward.
itiSeconds:
  type: double
  unit: s
  description: 'The inter-trial interval drawn for this trial (every trial draws its own), uniformly between trialStructure.itiMinSeconds and itiMaxSeconds: from itiStartTime to this trial''s stimulus with a quiet mouse, the time to drink included. A task''s quiet waits add quietWaitSeconds, so the stimulus was due at itiStartTime + itiSeconds + quietWaitSeconds (stimulusOnsetTime).'
  note: A rewarded trial's interval starts at its end (trialEndTime, the response window's end), the spouts drawn out spouts.rewardConsumptionSeconds into it (the time to drink, inside the interval); a penalised one's after the timeout (penaltyTimeoutSeconds).
quietWaitSeconds:
  type: double
  unit: s
  description: How long the quiet waits (lickQuietSeconds, wheelQuietSeconds and wheelQuietCm; OpenRigs.Core QuietWait) held this trial's start past the end of its interval less the lead; 0 with the waits off or a quiet mouse.
trialStartTime:
  type: double
  unit: s
  description: 'Harp time the trial started: the end of its interval less the lead, max(laserToStimulusSeconds, -spouts.stimulusToSpoutsInSeconds unless spouts.alwaysIn, 0) in the task file (Settings_Task), each 0 for a task file without its block, plus quietWaitSeconds where the task has quiet waits.'
stimulusOnsetTime:
  type: double
  unit: s
  description: 'Harp time the workflow commanded the stimulus on, NaN if it never was: the first tick of the 1 ms Harp clock at or after trialStartTime plus the lead, in every experiment. The physical onset is in the hardware logs.'
stimulusOffTime:
  type: double
  unit: s
  description: 'Harp time the workflow commanded the stimulus off (OpenRigs.Trials StimulusTiming): the earlier of stimulusOnsetTime plus stimulus.durationSeconds and outcomeTime plus stimulus.responseToStimulusOffSeconds (unless null), at the first tick at or after it; known at the outcome, so logged in the row although it may come later. NaN if the stimulus never came on, or in a task whose stimulus the trial loop does not time. A task that ends it sooner itself says so (its note).'
  note: The grating is hidden and the sound stopped (faded over 5 ms) at the trial loop's StimulusOff event; a miss's response is the response window's end. The physical offset is in the hardware logs.
outcomeTime:
  type: double
  unit: s
  description: Harp time the workflow knew the outcome, the same time as harpTime, as its own column so that every moment of a trial is named; the reward, the penalty sound and the timeout are timed from it. On a lick it is the Harp clock's latest tick when the workflow saw the lick, a few ms after it; each lick's own Harp time is in the lick detectors' logs.
  note: When the workflow saw the lick it counted as the choice, or the end of the response window on noResponse. The choice gives the outcome but does not end the trial (trialEndTime).
trialEndTime:
  type: double
  unit: s
  description: 'Harp time the trial ended and its timeout began: its outcomeTime; in a task whose response window always runs in full after a choice (responseWindowAlwaysFull; OpenRigs.Trials TrialTiming.ResponseWindowAlwaysFull), the response window''s end, rewarded or not (outcomeTime on a miss). The next interval starts at it plus penaltyTimeoutSeconds (itiStartTime). Known at the outcome, so logged in the row although it may come later.'
  note: Always the response window's end here (trialStructure.responseWindowAlwaysFull, fixed true), stimulusToResponseWindowSeconds plus responseWindowSeconds after the stimulus was due, whether the mouse chose or not, so every trial lasts the same; on noResponse it is outcomeTime.
rewardOfferedUl:
  type: double
  unit: ul
  description: 'Microlitres a reward on this trial gives, on every trial whether or not it was rewarded: the size the task drew for it (the task file''s reward size, or a larger reward where the task has one); 0 on a trial that offers none. rewarded says whether it was given; what was delivered is RewardDelivered in WorkflowData_Events.'
  note: The task file's reward.sizeUl times reward.largeMultiplier on a large-reward trial; 0 on a discriminationGoNoGo noGo or noReward trial, which offers none; a random trial's offer whether its coin came up heads or tails, and every trial's on a miss.
rewarded:
  type: bool
  description: True when the board answered the write that opened the valve for the trial's reward (rewardOfferedUl; its RewardDelivered row in WorkflowData_Events, a few ms after outcomeTime); false on an outcome that earned it when the board had not answered by the next outcome. A stop before the board answered leaves the trial with no row. Which outcomes are rewarded is the task's (its note).
  note: A correct choice (but a withheld noGo, correct and unrewarded), an auto-reward trial's miss (autoReward, choice noResponse, outcome auto), and a choice on a random trial whose coin came up heads, rewarded at the spout chosen.
penaltyTimeoutSeconds:
  type: double
  unit: s
  description: 'The timeout after this trial when it was penalised, else 0: the trial''s penalty.incorrect.timeoutSeconds, or on a miss its penalty.noResponse.timeoutSeconds. The next interval starts after it (itiStartTime).'
  note: Penalised - an incorrect choice (penalty.incorrect), or a miss that was not auto-rewarded (penalty.noResponse); in discriminationGoNoGo only a lick on a noGo trial (a go miss is unpenalised, and penalty.noResponse is null); a random-reward probe only with penaliseRandomProbes true (default false), then a choice on the coin's tails, as an incorrect choice, or a miss not auto-rewarded (penalty.noResponse); a noReward probe never.
penaltyFlashBrightness:
  type: double
  description: 'The brightness of the penalty flash after this trial when it was penalised, else 0: the trial''s penalty.incorrect.flash.brightness, or on a miss its penalty.noResponse.flash.brightness, 0 to 1 of the projector''s full white after gamma correction; 0 when no flash played. A flash covers the whole projector field at its kind''s flash.rateHz (white the first half of each cycle) from the outcome for the penalty sound''s length (OpenRigs.Vision PlayPenaltyFlash).'
  note: The penalised kind's penalty.incorrect.flash.brightness or penalty.noResponse.flash.brightness (OpenRigs.Vision PlayPenaltyFlash on the dome's projector).
penalised:
  type: bool
  description: 'True when the trial was penalised: the timeout (penaltyTimeoutSeconds) and the penalty sound at the trial''s penalty.incorrect.sound.levelDbfs, or on a miss its penalty.noResponse.sound.levelDbfs (none when mute), followed its outcome. Which trials are penalised, and which are misses, is the task''s (its note).'
  note: An incorrect choice, or a miss that was not on an auto-reward trial; in discriminationGoNoGo only a lick on a noGo trial (a false alarm; a go miss and a noReward trial are unpenalised); a random trial only with penaliseRandomProbes true (default false), then a choice on the coin's tails, or a miss not auto-rewarded; a noReward trial never.
laserCondition:
  type: int
  description: 'The Zapit condition sent to Zapit this trial (its conditions file''s number, from 1), laser on or off: every trial of an optogenetics experiment has one, so laser on is laserPowerMw > 0, not laserCondition > 0. 0 without optogenetics.'
laserPointsMm:
  type: string
  unit: mm
  description: 'Where Zapit aimed the laser this trial: laserCondition''s points in the conditions file (Settings_ZapitConditions), in mm as written there, each point its AP then its ML separated by a space, points in the file''s order separated by ; (stimLocations01 with ML [1.5, -1.5] and AP [-0.7, -0.7] is -0.7 1.5;-0.7 -1.5). Filled whenever laserCondition is above 0, laser on or off (at 0 mW the galvos still move there); empty without optogenetics.'
laserPowerMw:
  type: double
  unit: mW
  description: Laser power sent to Zapit for this trial (the task's optogenetics.laserPowerMw), as commanded, not measured. 0 on laser-off trials, without optogenetics, and on a trial answered before its trigger.
laserTriggerTime:
  type: double
  unit: s
  description: 'Harp time the workflow raised the Zapit trigger line (the laser, or at 0 mW the galvos and masking light alone): the first tick of the 1 ms Harp clock at or after laserToStimulusSeconds before the stimulus was due. NaN without optogenetics and on a trial that ended before its trigger, so a laser-off trial (a time, laserPowerMw 0) and one answered first (NaN) differ.'
trialConditionId:
  type: int
  description: The 0-based index of the trial's condition in trialConditions of the task file as run (Settings_Task), which gives its weight, pairs and condition-level values (set), from which its trialType is derived at Go. A repeat keeps the condition of the trial it repeats.
trialCombinationId:
  type: int
  description: 'The trial''s row in the experiment''s Settings_Combinations (0-based, session-wide): the combination it was drawn from, one pick of every list (pairs zipped), whose values that differ between combinations or from Settings_Task are the row''s values; the row''s trialConditionId and trialType are this trial''s. A repeat keeps the combination of the trial it repeats.'
visualInitialContrast:
  type: double
  description: Grating contrast as the trial starts, as BonVision's Contrast, 1 full contrast; 0 when no grating was shown.
  copyOf: visualStimulus.initialContrasts
visualPhaseRad:
  type: double
  unit: rad
  description: The grating's phase, drawn uniformly from 0 to 2 pi for every trial from the seeded stream (OpenRigs.Trials ConditionedTrial).
auditoryInitialLevelDbfs:
  type: double
  unit: dBFS
  description: The sound's level in dBFS RMS as the trial starts, the trial's auditoryStimulus.initialLevelDbfs; NaN when no sound played (mute).
  copyOf: auditoryStimulus.initialLevelDbfs
auditoryInitialAzimuthDeg:
  type: double
  unit: deg
  description: Azimuth of the speaker that played, rig.yml's nearest to the initial azimuth drawn; NaN when none played (auditoryInitialLevelDbfs NaN) or when every speaker played (auditoryStimulus.initialAzimuthsDeg all).
auditoryInitialElevationDeg:
  type: double
  unit: deg
  description: Elevation of the speaker that played as the trial starts; NaN when none or every speaker played, as auditoryInitialAzimuthDeg.
autoReward:
  type: bool
  description: 'True on an auto-reward trial (drawn with the task''s autoRewardProbability): one rewarded without a correct response, its outcome auto when the auto-reward answered it with no response of the mouse''s own; how, and so whether its reward came from the auto-reward, is the task''s (its note).'
  note: 'Its reward came from the auto-reward when the mouse made no choice (choice noResponse, outcome auto): its miss was rewarded at the target spout; a side chosen keeps its outcome, correct or incorrect. Forced false on a trial other than go in discriminationGoNoGo and on a probe (random or noReward).'
target:
  type: string
  values: [left, right, go, noGo, noReward, random]
  description: The answer the trial rewards, from its condition's target, in the task file's spelling - left or right, the side of the grating's or the sound's azimuth (visualSide, auditorySide) or named (left, right); in discriminationGoNoGo go (lick) or noGo (withhold). On a trial with no right answer (outcome probe, never repeated) noReward or random - noReward a no-reward probe (never rewarded or penalised; in localization and discriminationLeftRight both spouts in), random a random-reward probe in localization and discriminationLeftRight - both spouts in, a choice at either rewarded there on a coin drawn with the trial (heads), else unrewarded; tails and a miss not auto-rewarded are penalised only with penaliseRandomProbes true (default false).
choice:
  type: string
  values: [left, right, go, noResponse]
  description: The side the mouse chose, in the target's spelling; in discriminationGoNoGo go (thresholdLicks at the left spout), so a correct go trial has choice equal to target.
repeatCount:
  type: int
  description: How many times in a row the trial has been repeated, 0 for a new draw.
singleSpoutOffered:
  type: bool
  description: True when only the target's spout came in (in discriminationGoNoGo the left, on every trial); else both did. Drawn with spouts.singleSpoutProbability on a scored trial whose spouts move (spouts.alwaysIn false); never on a probe (random or noReward) in localization and discriminationLeftRight.
visualInitialAzimuthDeg:
  type: double
  unit: deg
  description: The azimuth the grating started at, one of visualStimulus.initialAzimuthsDeg (the licks then move it by azimuthShiftPerLickDeg); NaN when no grating was shown (visualInitialContrast 0), as auditoryInitialAzimuthDeg when no sound played.
  copyOf: visualStimulus.initialAzimuthsDeg
  nanWhen: {column: visualInitialContrast, equals: 0}
auditorySoundFileIndex:
  type: int
  description: Index into the auditory stimulus set (src\sounds\filtered_pink_pulse_<index>.wav), each one 50 ms pulse of noise played every 1/stimulus.rateHz s; until November 2026 each file (then filtered_pink_pulse_train_<index>.wav) held its pulse 12 times at 8 Hz, so an index names the same noise before and after.
spoutBiasSteps:
  type: int
  unit: steps
  description: 'The sum of the spouts'' bias correction moves (spouts.biasCorrection) before this trial''s own, in motor steps of the base transverse axis, positive toward the mouse''s left: 0 at every experiment''s start and with the correction off. A move this trial sets off (after an unrewarded outcome at once, after a reward at the SpoutsOut cue) is in the next row. The stage''s real position is in the SpoutMoved events, as a limit or a nudge can differ.'
