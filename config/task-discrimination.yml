# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_decision_making_task.json
# Task parameters for the coen-dome-decision-making modality discrimination task (Gerion's, from ActiveExperiemntsWithDiscrimination).
# The answer is the modality, not the side: the left spout for targetModality, the right spout for the other.
# trialWeights and rulesPerType name each trial type by what it shows: with targetModality visual, visual trials are
# target trials and auditory trials distractors (swap their weights for an auditory-target mouse). Visual-only and
# neutral trials are silent.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  taskType: discrimination
  targetModality: visual   # visual or auditory: the modality answered at the left spout; set per mouse on the form
  rngSeed: null            # null = draw a random seed; each seed used is a RngSeed event in BonsaiData_Async
  trialStructure:
    itiMinSeconds: 1.5            # s, Gerion's: from the outcome (after any timeout) to the next trial, drinkSeconds included
    itiMaxSeconds: 2.5            # s, Gerion's. His stage 0 (habituation) adds none: set both to 0 on the form
    drinkSeconds: 2.0             # s, from the outcome to drawing the spouts back
    openLoopSeconds: 0.0          # s
    closedLoopSeconds: 1.5        # s, the response window
    stimulusSeconds: 1.5          # s, the grating; at most openLoopSeconds + closedLoopSeconds
    stimulusToSpoutsInSeconds: 0.5   # s, from stimulus onset to spouts in
  visualStimulus:
    azimuthMinDeg: -60        # deg, grating azimuth drawn uniformly in [min, max]
    azimuthMaxDeg: 60         # deg
    fixedAzimuthsDeg: [-60, 60]   # deg, discrete grating azimuths; when set, used instead of [min, max]
    elevationMinDeg: 15       # deg, grating elevation drawn uniformly in [min, max]
    elevationMaxDeg: 15       # deg
    coherentAzimuthCapDeg: 80 # deg, |azimuth| kept below this on coherent trials
    gaussianWindowSigmaDeg: 20   # deg
    orientationDeg: 0         # deg
    spatialFrequencyCpd: 0.066666667   # cycles/deg
    temporalFrequencyHz: 0   # Hz, unsigned drift rate; direction is orthogonal to orientation
  audioStimulus:
    speakerLocations:      # lateral positions, one drawn per audio trial; no centre entry (fixed in code); playback uses the nearest wired speaker
      - { azimuth: -60, elevation: 15 }
      - { azimuth: 60, elevation: 15 }
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first lick
    degreesPerLick: 0      # deg the grating moves per net lick; 0 = stimulus fixed
  punishment:
    timeoutSeconds: 4.0   # s, after an incorrect choice or a miss (not after an auto-rewarded miss)
    sound:               # the error sound, on an incorrect choice
      enabled: true
      path: LocalFiles\error_tone.wav
      gain: 1.0
  reward:
    largeRewardMultiplier: 1
    largeRewardProbability: 0.0
  repeats:
    maxRepeats: 5
    rulesPerType: { visual: onFailure, auditory: onFailure, audiovisualCoherent: onFailure, audiovisualConflict: onTimeout, neutral: onTimeout }
  optogenetics:
    useZapit: false
    zapitConfigPath: ""
    laserPowerMw: null             # mW on laser-on trials, every condition; required with optogenetics on
    laserOnProbability: 0.5
    laserDurationSeconds: 2.5      # s
    armToTriggerSeconds: 0.1       # s, Zapit's armed reply to the trigger; every trial
    laserToStimulusSeconds: 0.5    # s, the trigger to the stimulus (stimulusOnsetTime); every trial
    noLaserOnRepeats: true
    trialsBeforeLaser: 20
  trainingStages:          # row index = stage id selected in the GUI; a stage past the end stops the workflow at Go
    - label: Stage 0       # habituation: target trials only, every miss auto-rewarded, spouts stay in
      trialWeights: { visual: 10, auditory: 0, audiovisualCoherent: 0, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 1.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3      # ul, planned from the valve's calibration
      contrasts: [1.0]
      allowRepeats: false
      spoutMovements: false
    - label: Stage 1       # target trials only, every miss auto-rewarded
      trialWeights: { visual: 10, auditory: 0, audiovisualCoherent: 0, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 1.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [1.0]
      allowRepeats: false
    - label: Stage 2       # distractor and coherent trials added
      trialWeights: { visual: 10, auditory: 10, audiovisualCoherent: 10, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.5, 1.0]
      allowRepeats: false
    - label: Stage 3       # conflict and neutral trials added
      trialWeights: { visual: 10, auditory: 10, audiovisualCoherent: 5, audiovisualConflict: 5, neutral: 1 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.5, 1.0]
      allowRepeats: false
    - label: Stage 4       # as stage 3, wider contrasts (Gerion's default row)
      trialWeights: { visual: 10, auditory: 10, audiovisualCoherent: 5, audiovisualConflict: 5, neutral: 1 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.5, 1.0, 2.0, 3.0]
      allowRepeats: false
