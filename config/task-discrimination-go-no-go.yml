# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_decision_making_task.json
# Task parameters for the coen-dome-decision-making go/no-go modality discrimination (Gerion's, from
# ActiveExperiemntsWithDiscrimination; his mice ran one spout). One spout, the left: lick on a goModality trial (Go),
# withhold on the other modality's (NoGo). Go and a lick: Correct, rewarded. Go and none: NoResponse,
# no penalty. NoGo and a lick: Incorrect, the penalty. NoGo and none: Correct, unrewarded. A trial showing both
# modalities (audiovisualCoherent, audiovisualConflict) or neither (neutral) is a Probe, never rewarded or penalised (Song et al. 2017).
# trialConditions' types name each kind of trial by its role: go (goModality alone), noGo (the other modality
# alone), audiovisualCoherent, audiovisualConflict, neutral; goModality, set per mouse, decides which modality fills go.
# A stage's conditions replace trialConditions whole. Conditions with no
# go weight are refused at Go. rulesPerType names go and noGo alone: a probe never repeats. Visual-only and neutral trials are silent.
# bothSpoutsProbability must be 0: only the left spout moves in.
# The training stages are the share's pipeline (config/training-pipelines/coen-dome-decision-making/<this file's name>):
# at launch app-rig-control writes the chosen stage's values over these defaults and fills trainingPipeline.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  taskType: discriminationGoNoGo
  goModality: visual       # visual or auditory: the modality to lick for; set per mouse on the form
  trialConditions:         # the trial mix, one whole value: a pipeline stage's conditions replace it; set: condition-level values (x-conditionFields)
    - { type: go, weight: 10, set: {} }
    - { type: noGo, weight: 10, set: {} }
    - { type: audiovisualCoherent, weight: 5, set: {} }
    - { type: audiovisualConflict, weight: 5, set: {} }
    - { type: neutral, weight: 1, set: {} }
  rngSeed: null            # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  trialStructure:
    itiMinSeconds: 1.5            # s, from the outcome (after any timeout) to the next stimulus, drinkSeconds included: what Gerion's
    itiMaxSeconds: 2.0            # s  mice got (1.5 s drink + max(ITI - 2, 0), ITI 1.5-2.5). Stage 0: set both to 1.5 on the form
    lickQuietSeconds: 0           # s with both spouts released before the trial start, from the interval's start (a held contact holds it); 0 off
    wheelQuietSeconds: 0          # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
    wheelQuietCm: 0               # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    drinkSeconds: 1.5             # s, from the outcome to drawing the spouts back; a false alarm (a lick on a NoGo trial): timeoutSeconds first
    responseDelaySeconds: 0.0     # s, from stimulus onset to the response window; licks before it do not count
    responseWindowSeconds: 1.5    # s, the response window: NoResponse at its end
    stimulusSeconds: 1.5          # s, the grating; at most responseDelaySeconds + responseWindowSeconds
    stimulusToSpoutsInSeconds: 0.5   # s, from stimulus onset to spouts in
  visualStimulus:
    startAzimuthsDeg: [-60, 60]   # deg, signed (right positive), one picked per trial with a stimulus; never 0. The grating starts there, the sound on the speaker nearest it (conflict: the mirrored azimuth)
    elevationDeg: 15          # deg, the grating's and the sound position's elevation
    gaussianWindowSigmaDeg: 20   # deg
    orientationDeg: 0         # deg
    spatialFrequencyCpd: 0.066666667   # cycles/deg
    temporalFrequencyHz: 0   # Hz, unsigned drift rate; direction is orthogonal to orientation
  auditoryStimulus:
    levelDbfs: -47.2       # dBFS RMS of each waveform as stored, before equalisation: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first lick
    degreesPerLick: 0      # deg the grating moves per net lick; 0 = stimulus fixed
  backgroundNoise:         # white noise on every speaker, unequalised, faded in at Ready at the level launched
    enabled: true
    levelDbfs: -60.1       # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  penalty:
    timeoutSeconds: 4.0   # s, after a false alarm (a lick on a NoGo trial); a miss on a Go trial has none, nor does a probe
    sound:               # the penalty sound, with every timeout
      enabled: true
      levelDbfs: -44.6   # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  reward:
    rewardSizeUl: 3               # ul, planned from the valve's calibration
    largeRewardMultiplier: 1
    largeRewardProbability: 0.0
  repeats:
    maxRepeats: 5
    rulesPerType: { go: onFailure, noGo: onFailure }   # only a trial with a right answer repeats: the probes (audiovisualCoherent, audiovisualConflict, neutral) never do
  optogenetics:
    enabled: false
    zapitConditionsPath: ""
    laserPowerMw: null             # mW on laser-on trials, every condition; required with optogenetics on
    laserOnProbability: 0.5
    laserDurationSeconds: 2.5      # s; with optogenetics on at most responseDelaySeconds + itiMinSeconds - 0.7 (0.8 here), so ticking optogenetics.enabled is refused until this is shortened
    laserToStimulusSeconds: 0.5    # s, signed: the trigger this long before the stimulus (negative: after); the lead applies with optogenetics off too
    noLaserOnRepeats: true
    trialsBeforeLaser: 20
  autoRewardProbability: 1.0           # chance a trial is auto-rewarded: its miss is rewarded at the target spout
  bothSpoutsProbability: 0.0           # chance both spouts move in rather than the correct one alone
  contrasts: [1.0]                     # grating contrasts, one drawn per trial that shows the grating
  allowRepeats: false                  # whether failed trials repeat (repeats.rulesPerType)
  spoutMovements: false                # false keeps the spouts in (habituation): no withdrawal, no single-spout move
  trainingPipeline:                    # app-rig-control fills it at launch (id, label, sha256 of the stage run); empty here: Go refuses it
