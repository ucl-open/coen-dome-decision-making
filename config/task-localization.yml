# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_decision_making_task.json
# Task parameters for the coen-dome-decision-making audiovisual localization task.
# Read by src/main.bonsai at Go and published as the TaskConfig subject (and at Start, as launched, for the background noise).
# trialWeights names each kind of trial by what it shows; the top-level one is per mouse, and a stage's own replaces it for
# that stage. rulesPerType names visual, auditory and audiovisualCoherent alone: audiovisualConflict and neutral trials have
# no right answer and never repeat: random-reward probes (target Random, outcome Probe), both spouts in, a choice at either
# rewarded there or penalised on a coin drawn with the trial, a miss as a scored miss.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  taskType: localization   # localization, discriminationGoNoGo or discriminationLeftRight
  trialWeights: { visual: 10, auditory: 10, audiovisualCoherent: 5, audiovisualConflict: 5, neutral: 1 }   # per mouse, carried; a stage's own trialWeights replaces it for that stage
  rngSeed: null           # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  trialStructure:
    itiMinSeconds: 3.4            # s, from the outcome (after any timeout) to the next stimulus, drinkSeconds included
    itiMaxSeconds: 4.4            # s
    drinkSeconds: 2.0             # s, from the outcome to drawing the spouts back; incorrect or miss: timeoutSeconds first
    responseDelaySeconds: 0.0     # s, from stimulus onset to the response window; licks before it do not count
    responseWindowSeconds: 1.5    # s, the response window: NoResponse at its end
    stimulusSeconds: 1.5          # s, the grating; at most responseDelaySeconds + responseWindowSeconds
    stimulusToSpoutsInSeconds: 0.5   # s, from stimulus onset to spouts in
  visualStimulus:
    azimuthMinDeg: -60        # deg, grating azimuth drawn uniformly in [min, max]
    azimuthMaxDeg: 60         # deg
    fixedAzimuthsDeg: [-60, 60]   # deg, discrete grating azimuths; when set, used instead of [min, max]
    elevationMinDeg: 15       # deg, grating elevation drawn uniformly in [min, max]
    elevationMaxDeg: 15       # deg
    coherentAzimuthCapDeg: 80 # deg, |azimuth| kept below this on coherent trials
    gaussianWindowSigmaDeg: 20   # deg
    orientationDeg: 0         # deg
    spatialFrequencyCpd: 0.066666667   # cycles/deg
    temporalFrequencyHz: 0   # Hz, unsigned drift rate; direction is orthogonal to orientation
  auditoryStimulus:
    levelDbfs: -47.2       # dBFS RMS of each waveform as stored, before equalisation: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
    speakerLocations:      # lateral positions, one drawn per auditory trial; no centre entry (fixed in code); playback uses the nearest wired speaker
      - { azimuth: -60, elevation: 15 }
      - { azimuth: 60, elevation: 15 }
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first-lick 2AFC
    degreesPerLick: 0      # deg the grating moves per net lick; 0 = stimulus fixed
  backgroundNoise:         # white noise on every speaker, unequalised, faded in at Ready at the level launched
    enabled: true
    levelDbfs: -60.1       # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  penalty:
    timeoutSeconds: 4.0   # s, after an incorrect choice, a miss (not an auto-rewarded one) or a probe's choice on the coin's tails
    sound:               # the penalty sound, with every timeout
      enabled: true
      levelDbfs: -44.6   # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  reward:
    largeRewardMultiplier: 1
    largeRewardProbability: 0.0
  repeats:
    maxRepeats: 5
    rulesPerType: { visual: onFailure, auditory: onFailure, audiovisualCoherent: onFailure }   # only a trial with a right answer repeats: audiovisualConflict and neutral never do
  optogenetics:
    enabled: false
    zapitConditionsPath: C:\Users\CoenLabUsers\zapit\experimental_configs\avdome_main_initialstim.yml
    laserPowerMw: 3.0              # mW on laser-on trials, every condition (avdome_main_initialstim.yml's laserPowerInMW, BLUE-OPTO-2)
    laserOnProbability: 0.5
    laserDurationSeconds: 2.5      # s
    laserToStimulusSeconds: 0.5    # s, signed: the trigger this long before the stimulus (negative: after); the lead applies with optogenetics off too
    noLaserOnRepeats: true
    trialsBeforeLaser: 20
  trainingStages:          # row index = the TrainingStage parameter; a stage past the end stops the workflow at Go
    - label: Habituation   # coherent only, single spout half the time, no repeats
      trialWeights: { visual: 0, auditory: 0, audiovisualCoherent: 10, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 0.5
      rewardSizeUl: 3      # ul, planned from the valve's calibration
      contrasts: [3.0]
      allowRepeats: false
      lickQuietSeconds: 0  # s with both spouts released before the trial start (a held contact holds it); 0 off
      wheelQuietSeconds: 0 # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
      wheelQuietCm: 0      # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    # Stage 1: coherent trials only
    - label: Coherent Only
      trialWeights: { visual: 0, auditory: 0, audiovisualCoherent: 10, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [3.0]
      allowRepeats: true
      lickQuietSeconds: 0  # s with both spouts released before the trial start (a held contact holds it); 0 off
      wheelQuietSeconds: 0 # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
      wheelQuietCm: 0      # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    # Stage 2: unisensory auditory added
    - label: Auditory Added
      trialWeights: { visual: 0, auditory: 10, audiovisualCoherent: 10, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.25, 0.5, 1.0]
      allowRepeats: true
      lickQuietSeconds: 0  # s with both spouts released before the trial start (a held contact holds it); 0 off
      wheelQuietSeconds: 0 # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
      wheelQuietCm: 0      # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    # Stage 3: unisensory visual added
    - label: Visual Added
      trialWeights: { visual: 10, auditory: 10, audiovisualCoherent: 10, audiovisualConflict: 0, neutral: 0 }
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.25, 0.5, 1.0]
      allowRepeats: true
      lickQuietSeconds: 0  # s with both spouts released before the trial start (a held contact holds it); 0 off
      wheelQuietSeconds: 0 # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
      wheelQuietCm: 0      # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    # Stage 4: conflict and neutral trials added: the task's trialWeights
    - label: Conflict Added
      autoRewardProbability: 0.0
      bothSpoutsProbability: 1.0
      rewardSizeUl: 3
      contrasts: [0.25, 0.5, 1.0]
      allowRepeats: true
      lickQuietSeconds: 0  # s with both spouts released before the trial start (a held contact holds it); 0 off
      wheelQuietSeconds: 0 # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
      wheelQuietCm: 0      # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
