# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_decision_making_task.json
# Task parameters for the coen-dome-decision-making audiovisual localization task.
# Read by src/main.bonsai at Go and published as the TaskText and TaskConfig subjects.
# Each trial condition says what its trials show and reward: its set over the task's values (any field but x-session-fields), its pairs
# picking listed values together; its trialType is derived from them (x-trial-types). A stage's conditions replace them whole. audiovisualConflict
# and neutral trials have no right answer: no-reward probes (target noReward, outcome probe), both spouts in,
# never rewarded or penalised (a stage may choose target random per condition: a random-reward probe, a choice at either rewarded on a coin,
# tails penalised only with penaliseProbes). Visual and neutral
# trials play the sound at the centre. A penalised miss has the timeout but no penalty sound (penalty.noResponse).
# The training stages are the share's curriculum (K:\config\curricula\coen-dome-decision-making\<this file's stem>.conditions.yml):
# at launch app-rig-control writes the chosen stage's values over these defaults and fills curriculum.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  rngSeed: null            # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  curriculum:              # app-rig-control fills it at launch (id, code, version, path, label, sha256 of the stage run); empty here: Go refuses it
  trialConditions:         # the trial mix, one whole value: a curriculum stage's conditions replace it; set: condition-level values (any field but x-session-fields)
    - weight: 10
      set: { target: visualSide, auditoryStimulus.initialAzimuthsDeg: [0] }
    - weight: 10
      set: { target: auditorySide, visualStimulus.initialContrasts: [0] }
    - weight: 5
      pairs: [[visualStimulus.initialAzimuthsDeg, auditoryStimulus.initialAzimuthsDeg]]
      set: { target: visualSide, visualStimulus.initialAzimuthsDeg: [-60, 60], auditoryStimulus.initialAzimuthsDeg: [-60, 60] }
    - weight: 5
      pairs: [[visualStimulus.initialAzimuthsDeg, auditoryStimulus.initialAzimuthsDeg]]
      set: { target: noReward, visualStimulus.initialAzimuthsDeg: [-60, 60], auditoryStimulus.initialAzimuthsDeg: [60, -60] }
    - weight: 1
      set: { target: noReward, visualStimulus.initialContrasts: [0], auditoryStimulus.initialAzimuthsDeg: [0] }
  trialStructure:
    itiMinSeconds: 2.5            # s, to the next stimulus: a rewarded trial is its outcome, then this ITI (the spouts drawn out spouts.rewardConsumptionSeconds into it); a penalised one its outcome, the timeout, then the ITI; neither, the ITI
    itiMaxSeconds: 3.5            # s
    lickQuietSeconds: 0           # s with both spouts released before the trial start, from the interval's start (a held contact holds it); 0 off
    wheelQuietSeconds: 0          # s with the wheel still before the trial start; 0 off
    wheelQuietCm: 0               # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds; 0 no movement
    stimulusToResponseWindowSeconds: 0.5     # s, from stimulus onset to the response window, at least a positive spouts.stimulusToSpoutsInSeconds; licks before it do not count
    responseWindowSeconds: 2.0    # s, the response window: noResponse at its end
  spouts:
    alwaysIn: false                    # true keeps the used spouts in (habituation): no withdrawal, no single-spout move
    stimulusToSpoutsInSeconds: 0.5     # s, signed: from stimulus onset to spouts in; negative, before it (the trial starts that much earlier)
    rewardConsumptionSeconds: 1.5      # s to drink, inside the ITI: the spouts drawn out this long into it; at most itiMinSeconds, less any lead of the spouts before the stimulus
    singleSpoutProbability: 0.5        # chance only the target's spout comes in, on a scored trial with the spouts moving
  stimulus:
    durationSeconds: 1.5       # s, the most the grating and the sound last from onset (null: no cap); at most stimulusToResponseWindowSeconds + responseWindowSeconds, and over before the next trial's earliest stimulus: the earliest outcome (stimulusToResponseWindowSeconds) + the shortest penalty timeout, 0 where a reward or neither can come (always here) + itiMinSeconds
    rateHz: 8                  # pulses a second, sound and grating together, each 50 ms; at most 20
    responseToStimulusOffSeconds: null      # s from the response (a miss: the response window's end) to both off; 0 at the response; null: the response does not end them
  visualStimulus:
    initialContrasts: [3.0]  # grating contrasts, one drawn per trial; 0 no grating
    initialAzimuthsDeg: [-60, 60]   # deg, signed (right positive), one picked per trial; never 0. The grating starts there
    initialElevationDeg: 15                  # deg
    initialSigmaDeg: 20                      # deg, the Gaussian window's sigma
    initialOrientationDeg: 0                 # deg
    initialSpatialFrequencyCpd: 0.066666667  # cycles/deg
    initialTemporalFrequencyHz: 0            # Hz, unsigned drift rate; direction is orthogonal to orientation
  auditoryStimulus:
    initialLevelDbfs: -40    # dBFS RMS while sounding, the waveform set as one (3.22 dB louder than as stored, -43.22); mute: no sound
    initialElevationDeg: 15  # deg, with the azimuth drawn, picks rig.yml's nearest speaker
    initialAzimuthsDeg: [-60, 60]   # deg, signed (right positive, 0 the centre), one picked per trial; the sound plays on the speaker nearest it, or on every speaker at all
  reward:
    sizeUl: 3              # ul, planned from the valve's calibration
    largeMultiplier: 2     # above 1
    largeProbability: 0.0  # 0: no large rewards
    tone:
      levelDbfs: mute      # the reward tone on a rewarded trial; mute: none (not played by this workflow yet, so only mute)
  autoRewardProbability: 0.0           # chance a trial is auto-rewarded: its miss is rewarded at the target spout
  penalty:                 # what a penalised trial costs, by its kind (each its own values)
    incorrect:            # an incorrect choice, or a probe's choice on the coin's tails when penaliseProbes
      timeoutSeconds: 4.0   # s; a penalised trial is its outcome, this timeout, then the ITI
      sound:
        levelDbfs: -35    # dBFS RMS; mute: no sound
      flash:                # the penalty flash on the projector, for the penalty sound's length
        brightness: 0       # 0 to 1 of the projector's full white; 0: no flash
        rateHz: 10          # Hz, at most 30
    noResponse:           # a penalised miss (not an auto-rewarded one; a probe's as a scored trial's when penaliseProbes)
      timeoutSeconds: 4.0   # s; a penalised trial is its outcome, this timeout, then the ITI
      sound:
        levelDbfs: mute   # dBFS RMS; mute: no sound
      flash:                # the penalty flash on the projector, for the penalty sound's length
        brightness: 0       # 0 to 1 of the projector's full white; 0: no flash
        rateHz: 10          # Hz, at most 30
  penaliseProbes: false    # false: a random-reward probe (target random; a noReward probe never is) is never penalised (tails unrewarded, a miss free); true: tails as incorrect, a miss as noResponse
  optogenetics:
    enabled: false
    zapitConditionsPath: C:\Users\CoenLabUsers\zapit\experimental_configs\avdome_main_initialstim.yml
    laserPowerMw: 3.0              # mW on laser-on trials, every condition (avdome_main_initialstim.yml's laserPowerInMW, BLUE-OPTO-2)
    laserOnProbability: 0.5
    laserToStimulusSeconds: 0.1    # s, signed: the trigger this long before the stimulus (negative: after); the lead applies with optogenetics off too
    trialsBeforeLaser: 20
    laserDurationSeconds: 2.5      # s; with optogenetics on at most stimulusToResponseWindowSeconds + itiMinSeconds - the Zapit conditions file's largest ramp-down - 0.2 s reply margin (2.3 s at a 0.5 s ramp-down here), checked at Go: 2.5 is over it, so ticking optogenetics.enabled is refused until this is shortened
  taskType: localization   # localization, discriminationGoNoGo or discriminationLeftRight
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first-lick 2AFC
    azimuthShiftPerLickDeg: 0   # deg the grating moves per net lick; 0 = stimulus fixed
  repeats:
    maxRepeats: 0          # repeats in a row at most; 0 exactly when repeatOn is never
    repeatOn: never        # never, noResponse or notCorrect; a probe (target random or noReward) never or noResponse
