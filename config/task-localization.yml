# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_dome_decision_making_task.json
# Task parameters for the coen-dome-decision-making audiovisual localization task.
# Read by src/main.bonsai at Go and published as the TaskText and TaskConfig subjects (and at Start, as launched, for the background noise).
# Each trial condition says what its trials show and reward: its set over the task's values (any field but x-session-fields), its pairs
# picking listed values together; its trialType names it. A stage's conditions replace them whole. audiovisualConflict
# and neutral trials have no right answer and never repeat: random-reward probes (target random, outcome Probe), both spouts in,
# a choice at either rewarded there or penalised on a coin drawn with the trial, a miss as a scored miss. Visual and neutral
# trials play the sound at the centre.
# The training stages are the share's curriculum (K:\config\curricula\coen-dome-decision-making\<this file's stem>.conditions.yml):
# at launch app-rig-control writes the chosen stage's values over these defaults and fills curriculum.
# The task as read at Go is written to the experiment folder as Settings\Settings_Task_<DateTime>.json.
taskParameters:
  taskType: localization   # localization, discriminationGoNoGo or discriminationLeftRight
  target: visualSide       # what a trial rewards, where a condition sets none (x-rules: visualSide, auditorySide or random here)
  trialConditions:         # the trial mix, one whole value: a curriculum stage's conditions replace it; set: condition-level values (any field but x-session-fields)
    - trialType: visual
      weight: 10
      set: { target: visualSide, auditoryStimulus.initialAzimuthsDeg: [0] }
    - trialType: auditory
      weight: 10
      set: { target: auditorySide, contrasts: [0] }
    - trialType: audiovisualCoherent
      weight: 5
      pairs: [[visualStimulus.initialAzimuthsDeg, auditoryStimulus.initialAzimuthsDeg]]
      set: { target: visualSide, visualStimulus.initialAzimuthsDeg: [-60, 60], auditoryStimulus.initialAzimuthsDeg: [-60, 60] }
    - trialType: audiovisualConflict
      weight: 5
      pairs: [[visualStimulus.initialAzimuthsDeg, auditoryStimulus.initialAzimuthsDeg]]
      set: { target: random, visualStimulus.initialAzimuthsDeg: [-60, 60], auditoryStimulus.initialAzimuthsDeg: [60, -60], bothSpoutsProbability: 1, repeats.repeatOn: never }
    - trialType: neutral
      weight: 1
      set: { target: random, contrasts: [0], auditoryStimulus.initialAzimuthsDeg: [0], bothSpoutsProbability: 1, repeats.repeatOn: never }
  rngSeed: null           # null = the workflow draws one at Go; each seed used is a RngSeed event in WorkflowData_Events
  trialStructure:
    itiMinSeconds: 3.4            # s, from the outcome (after any timeout) to the next stimulus, drinkSeconds included
    itiMaxSeconds: 4.4            # s
    lickQuietSeconds: 0           # s with both spouts released before the trial start, from the interval's start (a held contact holds it); 0 off
    wheelQuietSeconds: 0          # s with the wheel still before the trial start; 0 off (with wheelQuietCm 0)
    wheelQuietCm: 0               # cm of wheel travel (forward and back added) allowed in the last wheelQuietSeconds
    drinkSeconds: 2.0             # s, from the outcome to drawing the spouts back; incorrect or miss: timeoutSeconds first
    responseDelaySeconds: 0.0     # s, from stimulus onset to the response window; licks before it do not count
    responseWindowSeconds: 1.5    # s, the response window: NoResponse at its end
    stimulusSeconds: 1.5          # s, the grating; at most responseDelaySeconds + responseWindowSeconds
    stimulusToSpoutsInSeconds: 0.5   # s, from stimulus onset to spouts in
  visualStimulus:
    initialAzimuthsDeg: [-60, 60]   # deg, signed (right positive), one picked per trial; never 0. The grating starts there
    elevationDeg: 15          # deg, the grating's and the sound position's elevation
    gaussianWindowSigmaDeg: 20   # deg
    orientationDeg: 0         # deg
    spatialFrequencyCpd: 0.066666667   # cycles/deg
    temporalFrequencyHz: 0   # Hz, unsigned drift rate; direction is orthogonal to orientation
  auditoryStimulus:
    amplitude: 1           # scale of the waveform as stored (-47.2 dBFS RMS, the loudness mice have always had); 0 no sound
    initialAzimuthsDeg: [-60, 60]   # deg, signed (right positive, 0 the centre), one picked per trial; the sound plays on the speaker nearest it, or on every speaker at all
  response:
    thresholdLicks: 1      # net lick difference ending the response window; 1 = first-lick 2AFC
    degreesPerLick: 0      # deg the grating moves per net lick; 0 = stimulus fixed
  backgroundNoise:         # white noise on every speaker, unequalised, faded in at Ready at the level launched
    enabled: true
    levelDbfs: -60.1       # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  penalty:
    timeoutSeconds: 4.0   # s, after an incorrect choice, a miss (not an auto-rewarded one) or a probe's choice on the coin's tails
    sound:               # the penalty sound, with every timeout
      enabled: true
      levelDbfs: -44.6   # dBFS RMS: the level mice have always had (the lab's defaults: lib-open-rigs' OpenRigs.Audio SoundLevel)
  reward:
    rewardSizeUl: 3               # ul, planned from the valve's calibration
    largeRewardMultiplier: 1
    largeRewardProbability: 0.0
  repeats:
    maxRepeats: 5          # repeats in a row at most
    repeatOn: never        # never, noResponse or notCorrect; a probe (target random) never repeats
  optogenetics:
    enabled: false
    zapitConditionsPath: C:\Users\CoenLabUsers\zapit\experimental_configs\avdome_main_initialstim.yml
    laserPowerMw: 3.0              # mW on laser-on trials, every condition (avdome_main_initialstim.yml's laserPowerInMW, BLUE-OPTO-2)
    laserOnProbability: 0.5
    laserDurationSeconds: 2.5      # s
    laserToStimulusSeconds: 0.5    # s, signed: the trigger this long before the stimulus (negative: after); the lead applies with optogenetics off too
    noLaserOnRepeats: true
    trialsBeforeLaser: 20
  autoRewardProbability: 0.0           # chance a trial is auto-rewarded: its miss is rewarded at the target spout
  bothSpoutsProbability: 0.5           # chance both spouts move in rather than the correct one alone
  contrasts: [3.0]                     # grating contrasts, one drawn per trial; 0 no grating
  curriculum:                    # app-rig-control fills it at launch (id, code, version, path, label, sha256 of the stage run); empty here: Go refuses it
